name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"

      - name: Lint
        run: ruff check maskills scripts tests

      # Covers the unit tests and tests/test_scripts_load.py, which loads every
      # experiment driver in scripts/.
      - name: Test
        run: pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build the wheel
        run: |
          pip install build
          python -m build

      - name: The wheel must carry the critic prompts and env resources
        run: |
          python - <<'PY'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          for want in ("envs/language/prompts/evaluation/templates/",
                       "envs/language/tools/",
                       "envs/locomo/prompts/"):
              assert any(want in n for n in names), f"{wheel} is missing {want}"
          print(f"{len(names)} files in the wheel")
          PY
